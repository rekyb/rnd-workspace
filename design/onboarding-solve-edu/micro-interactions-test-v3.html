<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Micro-Interactions Test - Minimalist</title>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,300,1,0" />
  <style>
    :root {
      --purple: #8e279b;
      --purple-hover: #7a2e86;
      --purple-bg: #fcf8ff;
      --ink: #2c2833;
      --sub: #878290;
      --bg: #ffffff;
      --surf: #ffffff;
      --hair: #f0f0f0;
      --blue: #2397cb;
      --blue-bg: #f5fcff;
      --error-bg: #fff0f0;
      --error-text: #d32f2f;
      
      --font-head: 'Plus Jakarta Sans', sans-serif;
      --font-body: 'Open Sans', sans-serif;
      
      /* The core easing for "Minimalist Fade & Reveal" */
      --easing-minimal: ease-in-out;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-body);
      background-color: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1, h2, h3 { font-family: var(--font-head); font-weight: 500; }
    
    /* Header & Progress Bar */
    .header {
      width: 100%;
      padding: 32px 24px;
      display: flex;
      justify-content: center;
      background: var(--surf);
    }
    .progress-container {
      width: 100%;
      max-width: 300px;
      height: 2px;
      background: var(--hair);
      overflow: hidden;
    }
    #progress-bar {
      width: 0%;
      height: 100%;
      background: var(--ink); /* Monochromatic and understated */
      transition: width 1s var(--easing-minimal);
    }

    /* Screen Transitions */
    .main-container {
      flex: 1;
      width: 100%;
      max-width: 600px;
      padding: 60px 24px;
      position: relative;
    }
    .card {
      background: var(--surf);
      width: 100%;
      display: none;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .card.active {
      display: flex;
      animation: slowFadeIn 0.8s var(--easing-minimal) forwards;
    }
    @keyframes slowFadeIn {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }

    .title { font-size: 24px; font-weight: 500; margin-bottom: 24px; color: var(--ink); letter-spacing: -0.5px; }
    p { font-size: 15px; color: var(--sub); font-weight: 400; line-height: 1.6; }
    
    /* Buttons - Flat and Subtle */
    .btn {
      font-family: var(--font-head);
      padding: 14px 32px;
      border-radius: 4px; /* Minimal border radius */
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid transparent;
      transition: background 0.4s ease, color 0.4s ease, border-color 0.4s ease;
      width: 100%;
      max-width: 240px;
      margin-top: 32px;
      letter-spacing: 0.5px;
    }
    .btn-primary {
      background: var(--ink);
      color: var(--surf);
    }
    .btn-primary:hover {
      background: #4a4455;
    }

    /* Option Cards (Goals) - Flat and Subtle */
    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      width: 100%;
      margin-top: 16px;
    }
    .option-card {
      border: 1px solid var(--hair);
      border-radius: 8px;
      padding: 32px 16px;
      cursor: pointer;
      background: var(--surf);
      transition: border-color 0.4s ease, background 0.4s ease, color 0.4s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      color: var(--sub);
    }
    .option-card:hover {
      border-color: #d0c0e0;
      color: var(--ink);
    }
    .option-card.selected {
      border-color: var(--purple);
      background: var(--purple-bg);
      color: var(--purple);
    }
    
    /* 6-Digit Code Input */
    .code-group {
      display: flex;
      gap: 12px;
      margin-bottom: 8px;
    }
    .code-digit {
      width: 48px; height: 60px;
      border: none;
      border-bottom: 1px solid #ccc;
      background: transparent;
      font-size: 24px; font-weight: 400; text-align: center;
      color: var(--ink);
      transition: border-color 0.4s ease, background 0.4s ease;
      border-radius: 0;
    }
    .code-digit:focus {
      border-bottom: 1px solid var(--ink);
      outline: none;
    }
    .error-flash {
      animation: errorColorFlash 1s ease;
    }
    @keyframes errorColorFlash {
      0%, 100% { background: transparent; border-bottom-color: #ccc; }
      20% { background: var(--error-bg); border-bottom-color: var(--error-text); }
    }
    .error-msg {
      opacity: 0;
      color: var(--error-text);
      font-size: 13px;
      margin-top: 16px;
      transition: opacity 0.4s ease;
    }

    /* Success Screen Slow Reveals */
    .reveal-1 { opacity: 0; animation: slowFadeIn 1.2s var(--easing-minimal) 0.2s forwards; }
    .reveal-2 { opacity: 0; animation: slowFadeIn 1.2s var(--easing-minimal) 1.2s forwards; }
    
    .program-card {
      background: transparent;
      border-top: 1px solid var(--hair);
      border-bottom: 1px solid var(--hair);
      padding: 32px 0;
      text-align: center;
      width: 100%;
      margin-top: 40px;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="progress-container">
      <div id="progress-bar"></div>
    </div>
  </div>

  <div class="main-container">
    
    <!-- Step 1: Code Input -->
    <div id="step-1" class="card active">
      <h1 class="title">Program Code</h1>
      <p style="margin-bottom: 40px; max-width: 400px;">Enter an incorrect code to see the quiet color flash error, then "123456".</p>
      
      <div class="code-group" id="code-container">
        <input type="text" maxlength="1" class="code-digit" autofocus>
        <input type="text" maxlength="1" class="code-digit">
        <input type="text" maxlength="1" class="code-digit">
        <input type="text" maxlength="1" class="code-digit">
        <input type="text" maxlength="1" class="code-digit">
        <input type="text" maxlength="1" class="code-digit">
      </div>
      
      <div id="error-msg" class="error-msg">Code not recognized.</div>
      
      <button class="btn btn-primary" onclick="verifyCode()">Continue</button>
    </div>

    <!-- Step 2: Goal Selection -->
    <div id="step-2" class="card">
      <h1 class="title">Area of focus</h1>
      
      <div class="options-grid">
        <div class="option-card" onclick="selectOption(this)">
          <span class="material-symbols-rounded" style="font-size: 24px;">bar_chart</span>
          <span style="font-weight: 500; font-size: 14px;">Data Analysis</span>
        </div>
        <div class="option-card" onclick="selectOption(this)">
          <span class="material-symbols-rounded" style="font-size: 24px;">forum</span>
          <span style="font-weight: 500; font-size: 14px;">Communication</span>
        </div>
      </div>
      
      <button class="btn btn-primary" onclick="goToStep(3, 100)">Continue</button>
    </div>

    <!-- Step 3: Success Screen -->
    <div id="step-3" class="card" style="background: transparent;">
      <h1 class="title reveal-1" style="font-size: 28px; margin-bottom: 16px;">Welcome to Solve</h1>
      <p class="reveal-1">Your enrollment is confirmed.</p>
      
      <div class="program-card reveal-2">
        <div style="font-size: 11px; font-weight: 600; color: var(--sub); text-transform: uppercase; letter-spacing: 1px;">Enrolled Program</div>
        <div style="font-size: 18px; font-weight: 400; color: var(--ink); margin: 12px 0;">Youth Job Readiness</div>
        <div style="font-size: 13px; color: var(--sub);">Facilitated by Jane Doe</div>
      </div>
    </div>

  </div>

  <script>
    // Progress Bar Initialization
    setTimeout(() => { document.getElementById('progress-bar').style.width = '33%'; }, 300);

    // Code Input UX - Minimalist
    const inputs = document.querySelectorAll('.code-digit');
    inputs.forEach((input, index) => {
      input.addEventListener('input', (e) => {
        if (e.target.value.length === 1 && index < inputs.length - 1) {
          inputs[index + 1].focus();
        }
      });
    });

    function verifyCode() {
      let code = Array.from(inputs).map(i => i.value).join('');
      if (code === '123456') {
        goToStep(2, 66);
      } else {
        const errorMsg = document.getElementById('error-msg');
        errorMsg.style.opacity = '1';
        
        inputs.forEach(input => {
          input.classList.remove('error-flash');
          void input.offsetWidth; // trigger reflow
          input.classList.add('error-flash');
        });
        
        setTimeout(() => {
          errorMsg.style.opacity = '0';
        }, 3000);
      }
    }

    function selectOption(el) {
      document.querySelectorAll('.option-card').forEach(c => c.classList.remove('selected'));
      el.classList.add('selected');
    }

    function goToStep(stepNumber, progressPercentage) {
      // Hide all steps
      document.querySelectorAll('.card').forEach(c => {
        c.classList.remove('active');
      });
      // Update progress slowly
      document.getElementById('progress-bar').style.width = progressPercentage + '%';
      
      // Delay slightly for the new step to fade in deliberately
      setTimeout(() => {
        document.getElementById('step-' + stepNumber).classList.add('active');
      }, 200);
    }
  </script>
</body>
</html>
